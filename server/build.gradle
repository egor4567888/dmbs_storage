// TCP-сервер, обёртка вокруг storage.Storage. Зависит от storage и protocol.
dependencies {
    implementation project(':storage')
    implementation project(':protocol')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

// Удобный запуск из CLI: gradle :server:runServer -PstateDir=/tmp/kvstate -Pport=12345
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Запустить сервер: -PstateDir=<dir> -Pport=<port>'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dbms.server.ServerMain'
    standardInput = System.in
    args = [
            project.findProperty('stateDir') ?: '/tmp/kvstate',
            project.findProperty('port') ?: '12345'
    ]
}
